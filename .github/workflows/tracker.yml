name: Update the tracker from the Ohio EPA list

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours (GitHub may start it a little late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install openpyxl==3.1.5 xlsxwriter==3.2.0 python-calamine==0.8.2
      - name: Build from the Ohio EPA list
        run: python3 build.py
      - name: Check every number independently
        run: python3 verify.py
      - name: Prepare the dashboard files
        run: python3 dash_export.py
      - name: Save (only if every check passed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dash
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Tracker update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Copy the dashboard files to the Hugging Face Space
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ ! -f dash/summary.json ]; then echo "::warning::Dashboard files were not copied to Hugging Face (no HF_TOKEN secret, or no files)"; exit 0; fi
          pip install --quiet huggingface_hub==0.26.2
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).upload_folder(
              repo_id='DanielK1320/OhioDemoAbatementTracker', repo_type='space', folder_path='dash', path_in_repo='dash',
              delete_patterns=['*.json'], commit_message='Dashboard data from GitHub run ' + os.environ.get('GITHUB_RUN_ID', ''))
          print('copied dash/ to DanielK1320/OhioDemoAbatementTracker')
          PY
